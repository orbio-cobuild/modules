# Public repo: builds and releases the package when a version tag (v1.2.3) is pushed.
# The release is created by github-actions[bot] with the repo's own GITHUB_TOKEN.
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Never replace a published release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release $GITHUB_REF_NAME already exists"; exit 1; fi
      - name: Pack
        run: |
          npm pack
          test -f "cofounder-modules-$VERSION.tgz"
          sha256sum "cofounder-modules-$VERSION.tgz" | tee SHA256SUMS
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" "cofounder-modules-$VERSION.tgz" SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "Install: \`\"@cofounder/modules\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/cofounder-modules-$VERSION.tgz\"\`"
